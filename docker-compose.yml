version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vehicle-marketplace-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vehicle_marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vehicle-marketplace-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vehicle_marketplace
      JWT_ACCESS_SECRET: your-access-secret-change-in-production
      JWT_REFRESH_SECRET: your-refresh-secret-change-in-production
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run prisma:migrate && npm run prisma:seed && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vehicle-marketplace-web
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
